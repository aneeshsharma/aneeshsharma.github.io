- id: prototype-aether
  order: 1
  title: Prototype Aether
  description: >-
    A privacy-focused peer-to-peer communication protocol in Rust — a core
    protocol library published to crates.io, a tracker server for peer
    discovery via UDP holepunching, a REST API service wrapper, and a
    benchmarking suite for throughput/latency under varying network
    conditions.
  href: https://github.com/Prototype-Aether
  tags: [Rust, P2P Networking, crates.io]
  span: 3
  accent: purple

- id: discord-audio-share-linux
  order: 2
  title: DiscordAudioShare-Linux
  description: >-
    A utility to share audio on Discord on Linux by routing your desktop
    audio through your mic, using PulseAudio to create a virtual sink and
    loopback so any app's output can be picked up as mic input.
  href: https://github.com/aneeshsharma/DiscordAudioShare-Linux
  tags: [Shell, PulseAudio, Linux]
  span: 3
  accent: blue
